version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: farmlive_db
    environment:
      POSTGRES_USER: farmlive_user
      POSTGRES_PASSWORD: farmlive_password
      POSTGRES_DB: farmlive
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - farmlive_network
    restart: unless-stopped

  installer:
    image: node:20-slim
    container_name: farmlive_installer
    working_dir: /app
    volumes:
      - .:/app
    command: bash -c "npm install -g pnpm && pnpm install"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: farmlive_api
    depends_on:
      installer:
        condition: service_completed_successfully
      db:
        condition: service_started
    ports:
      - "3002:3002"
    environment:
      - DATABASE_URL=postgresql://farmlive_user:farmlive_password@db:5432/farmlive?schema=public
      - PORT=3002
      - CI=true
    volumes:
      - .:/app
    working_dir: /app/apps/api
    command: bash /app/apps/api/start.sh
    networks:
      - farmlive_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: farmlive_web
    depends_on:
      installer:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3002
      - PORT=3000
      - CI=true
    volumes:
      - .:/app
      - /app/apps/web/.next
    working_dir: /app/apps/web
    command: bash /app/apps/web/start.sh
    networks:
      - farmlive_network

volumes:
  pgdata:

networks:
  farmlive_network:
    driver: bridge
